name: Container images

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

# Serialize master builds; only obsolete pull request checks are cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  images:
    name: Build, test, and publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build test image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: test
          platforms: linux/amd64
          load: true
          tags: tgdlbot:ci-test
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=tgdlbot-test
          cache-to: type=gha,mode=max,scope=tgdlbot-test

      - name: Run offline tests
        run: docker run --rm --network none tgdlbot:ci-test

      - name: Build production image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: production
          platforms: linux/amd64
          load: true
          tags: tgdlbot:ci-production
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: |
            type=gha,scope=tgdlbot-production
            type=gha,scope=tgdlbot-test
          cache-to: type=gha,mode=max,scope=tgdlbot-production

      - name: Test FFmpeg in production image
        run: |
          docker run --rm --network none tgdlbot:ci-production ffmpeg -version
          docker run --rm --network none tgdlbot:ci-production ffprobe -version
          docker run --rm --network none \
            --mount "type=bind,src=$GITHUB_WORKSPACE/tests,dst=/app/tests,readonly" \
            tgdlbot:ci-production \
            python -m unittest discover -s tests -p 'test_video_*_ffmpeg.py' -v

      - name: Log in to GitHub Container Registry
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tag and push the exact images that passed the checks above.
      - name: Publish images
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        shell: bash
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          for tag in "sha-$GITHUB_SHA" master latest; do
            docker tag tgdlbot:ci-production "$image:$tag"
            docker push "$image:$tag"
          done
          for tag in "test-sha-$GITHUB_SHA" test; do
            docker tag tgdlbot:ci-test "$image:$tag"
            docker push "$image:$tag"
          done
          {
            echo '### Published container images (linux/amd64)'
            echo "Production: $image:sha-$GITHUB_SHA (also master, latest)"
            echo "Test: $image:test-sha-$GITHUB_SHA (also test)"
          } >> "$GITHUB_STEP_SUMMARY"
