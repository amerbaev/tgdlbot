name: Container images

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

# Serialize master builds; only obsolete pull request checks are cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.target }}, ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: [production, test]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/${{ matrix.arch }}
          outputs: type=docker,dest=${{ runner.temp }}/${{ matrix.target }}-${{ matrix.arch }}.tar
          tags: tgdlbot:ci-${{ matrix.target }}-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=tgdlbot-${{ matrix.target }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=tgdlbot-${{ matrix.target }}-${{ matrix.arch }}

      - name: Upload image
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: image-${{ matrix.target }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/${{ matrix.target }}-${{ matrix.arch }}.tar
          if-no-files-found: error
          # Re-running the build job replaces its earlier archive in this run.
          overwrite: true
          compression-level: 1
          retention-days: 3

  test:
    name: Test (${{ matrix.target }}, ${{ matrix.arch }})
    needs: build
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        target: [production, test]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      IMAGE_NAME: tgdlbot:ci-${{ matrix.target }}-${{ matrix.arch }}
    steps:
      - name: Check out FFmpeg tests
        if: matrix.target == 'production'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Download image
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: image-${{ matrix.target }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/images

      - name: Load image
        env:
          IMAGE_ARCHIVE: ${{ runner.temp }}/images/${{ matrix.target }}-${{ matrix.arch }}.tar
        run: docker load --input "$IMAGE_ARCHIVE"

      - name: Verify image architecture and Python startup
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          test "$(docker image inspect "$IMAGE_NAME" --format '{{.Architecture}}')" = "$EXPECTED_ARCH"
          docker run --rm --network none --env EXPECTED_ARCH "$IMAGE_NAME" python -c '
          import os, platform
          expected = {"amd64": "x86_64", "arm64": "aarch64"}[os.environ["EXPECTED_ARCH"]]
          actual = platform.machine()
          assert actual == expected, (actual, expected)
          print("Python started on", actual)
          '

      - name: Run offline tests
        if: matrix.target == 'test'
        run: docker run --rm --network none "$IMAGE_NAME"

      - name: Test FFmpeg in production image
        if: matrix.target == 'production'
        run: |
          docker run --rm --network none "$IMAGE_NAME" ffmpeg -version
          docker run --rm --network none "$IMAGE_NAME" ffprobe -version
          docker run --rm --network none \
            --mount "type=bind,src=$GITHUB_WORKSPACE/tests,dst=/app/tests,readonly" \
            "$IMAGE_NAME" \
            python -m unittest discover -s tests -p 'test_video_*_ffmpeg.py' -v

  publish:
    name: Publish to GHCR
    needs: test
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      packages: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Download tested images
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: image-*
          merge-multiple: true
          path: ${{ runner.temp }}/images

      - name: Load tested images
        env:
          IMAGE_DIRECTORY: ${{ runner.temp }}/images
        run: |
          for target in production test; do
            for arch in amd64 arm64; do
              docker load --input "$IMAGE_DIRECTORY/$target-$arch.tar"
            done
          done

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tag and push the exact images that passed the checks above.
      - name: Publish images
        shell: bash
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          for target in production test; do
            prefix=sha
            if [ "$target" = test ]; then
              prefix=test-sha
            fi
            ref="$image:$prefix-$GITHUB_SHA"
            for arch in amd64 arm64; do
              docker tag "tgdlbot:ci-$target-$arch" "$ref-$arch"
              docker push "$ref-$arch"
            done
            docker buildx imagetools create --tag "$ref" "$ref-amd64" "$ref-arm64"
            docker buildx imagetools inspect --raw "$ref" > "$RUNNER_TEMP/$target-index.json"
            jq -e '
              (.manifests | map(.platform.os + "/" + .platform.architecture) | sort)
              == ["linux/amd64", "linux/arm64"]
            ' "$RUNNER_TEMP/$target-index.json"
          done
          # Update mutable tags only after both indexes contain both architectures.
          docker buildx imagetools create --tag "$image:master" --tag "$image:latest" "$image:sha-$GITHUB_SHA"
          docker buildx imagetools create --tag "$image:test" "$image:test-sha-$GITHUB_SHA"
          {
            echo '### Published container images (linux/amd64, linux/arm64)'
            echo "Production: $image:sha-$GITHUB_SHA (also master, latest)"
            echo "Test: $image:test-sha-$GITHUB_SHA (also test)"
          } >> "$GITHUB_STEP_SUMMARY"
