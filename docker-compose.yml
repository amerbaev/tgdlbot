services:
  # Production сервис
  tgdlbot:
    image: ghcr.io/amerbaev/tgdlbot:${TGDLBOT_IMAGE_TAG:-latest}
    pull_policy: always
    container_name: tgdlbot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./downloads:/app/downloads
      - ./cookies:/app/cookies:ro
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Test сервис (для запуска тестов)
  test:
    image: ghcr.io/amerbaev/tgdlbot:${TGDLBOT_TEST_IMAGE_TAG:-test}
    pull_policy: always
    network_mode: none
    container_name: tgdlbot-test
    profiles:
      - test  # Только при явном вызове
