[project]
name = "tgdlbot"
version = "0.1.0"
description = "Telegram bot for downloading YouTube videos"
requires-python = ">=3.14"
dependencies = [
    "python-telegram-bot>=22.8",
    "yt-dlp[curl-cffi]>=2026.8.19",
    "python-dotenv>=1.2.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-mock>=3.15.1",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
